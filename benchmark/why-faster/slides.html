@eyebrow A Julia package
# HyperHessians.jl
~ Hessians from hyper-dual numbers. This talk: how dual numbers work, what a hyper-dual number is, and how the package uses them — with a section on why it ends up fast.
@chips github.com/KristofferC/HyperHessians.jl | Hessians · Hessian-vector products · threading

---
@eyebrow Dual numbers
# One rule: ε² = 0

```The rule | an infinitesimal that squares to zero
ε² = 0,   ε ≠ 0

f(x + ε) = f(x) + f′(x)·ε      # the Taylor series cuts itself off:
                               # every higher term has an ε² in it
```

```The product rule comes out by itself | no calculus needed
(a + a′ε) · (b + b′ε)  =  ab + (a′b + ab′)ε + a′b′·ε²
                       =  ab + (a′b + ab′)ε
```

> A dual number is a pair (value, derivative). Push pairs through your function and each operation updates both. Write down one rule per operation and you are done.

---
@eyebrow Dual numbers
# Forward mode in a dozen lines

::: cols
:: col 1.3
```mini ForwardDiff | complete and runnable
struct Dual{T} <: Number
    v::T   # value
    ϵ::T   # coefficient of ε
end

Base.:+(a::Dual, b::Dual) = Dual(a.v + b.v, a.ϵ + b.ϵ)
Base.:-(a::Dual, b::Dual) = Dual(a.v - b.v, a.ϵ - b.ϵ)
Base.:*(a::Dual, b::Dual) = Dual(a.v*b.v, a.ϵ*b.v + a.v*b.ϵ)
Base.sin(d::Dual) = Dual(sin(d.v),  cos(d.v) * d.ϵ)
Base.cos(d::Dual) = Dual(cos(d.v), -sin(d.v) * d.ϵ)
Base.exp(d::Dual) = Dual(exp(d.v),  exp(d.v) * d.ϵ)

[+] derivative(f, x) = f(Dual(x, one(x))).ϵ   # seed ϵ = 1
```
:: col
```julia> | seed, run, read off
julia> derivative(x -> x^2 + sin(x), 1.0)
2.5403023058681398

julia> 2 + cos(1.0)        # by hand
2.5403023058681398
```

- `Dual <: Number` plus operator overloading — your `f` is untouched. Loops, branches, `^`: it all just works.
- The result is exact, not a finite difference.
- Real ForwardDiff.jl is this plus rules for all of Base, promotion, and safety tags.
:::

---
@eyebrow Dual numbers
# Gradients: N partials per number

::: cols
:: col 1.3
```the whole diff | one field changes, rules get a dot
struct Dual{N,T} <: Number
    v::T
[-]     ϵ::T                # one derivative…
[+]     ∂::NTuple{N,T}      # …becomes N partials
end

[-] Base.:*(a, b) = Dual(a.v*b.v, a.ϵ*b.v + a.v*b.ϵ)
[+] Base.:*(a, b) = Dual(a.v*b.v, b.v .* a.∂ .+ a.v .* b.∂)

function gradient(f, x::Vector{T}) where T
    N = length(x)
[+]     seed(i) = ntuple(j -> T(i == j), N)   # basis vectors
    f([Dual(x[i], seed(i)) for i in 1:N]).∂
end
```
:: col
```julia> | all partials in one pass
julia> gradient(v -> v[1]*v[2] + sin(v[1]),
                [1.0, 2.0])
(2.5403023058681398, 1.0)
#  ∂f/∂x = y + cos(x)   ∂f/∂y = x
```

- Seed input i with basis vector eᵢ, call `f` once, read off every partial.
- For long inputs you cap N and do ⌈n/N⌉ passes — that's chunking.
:::

---
@eyebrow Dual numbers
# Second derivatives: differentiate twice

::: cols
:: col
```Two infinitesimals | ε₁² = ε₂² = 0, but ε₁ε₂ ≠ 0
f(x + ε₁ + ε₂)
  = f + f′·(ε₁ + ε₂) + ½ f″·(ε₁ + ε₂)²
  = f + f′ε₁ + f′ε₂ + f″·ε₁ε₂

# the cross term is the second derivative
```

- Works because `Dual` arithmetic is itself just `+`, `*`, `sin`, … — so you can differentiate it again.
- Look at what gets stored, though: `f′` twice, and `f″` two levels deep.
:: col
```Dual of Dual | no new code — one extra method
second_derivative(f, x) =
    derivative(y -> derivative(f, y), x)

[+] Base.one(d::Dual) = Dual(one(d.v), zero(d.v))
# ↑ the seed of the outer pass must be a Dual
```

```julia> | nested duals
julia> second_derivative(x -> x^2 + sin(x), 1.0)
1.1585290151921035        # 2 - sin(1) ✓

julia> Dual(Dual(1.0, 1.0), Dual(1.0, 0.0))
# what the input looks like inside
```
:::

---
@eyebrow Hyper-dual numbers
# The same algebra, flattened to one level

::: cols
:: col
```Nested Dual | cross term hidden inside
Dual(Dual(x, 1), Dual(1, 0))

f ↦ Dual(Dual(f, f′), Dual(f′, f″))

# f′ computed and stored twice
# f″ buried two levels deep
```

```julia> | same answer, one pass
julia> f = x -> x^2 + sin(x);

julia> f(HyperDual(1.0, 1.0, 1.0, 0.0))
HyperDual(1.8414…, 2.5403…, 2.5403…, 1.1585…)
#          f       f′       f′       f″
```
:: col 1.2
```HyperDual | cross term is just a field — h = v + aϵ₁ + bϵ₂ + Aϵ₁ϵ₂
struct HyperDual{T} <: Number
    v::T; ϵ₁::T; ϵ₂::T; ϵ₁₂::T
end

Base.:*(a, b) = HyperDual(a.v*b.v,
    a.v*b.ϵ₁ + a.ϵ₁*b.v,
    a.v*b.ϵ₂ + a.ϵ₂*b.v,
[+]     a.v*b.ϵ₁₂ + a.ϵ₁₂*b.v + a.ϵ₁*b.ϵ₂ + a.ϵ₂*b.ϵ₁)

chain(h, f, f′, f′′) = HyperDual(f, f′*h.ϵ₁, f′*h.ϵ₂,
    f′*h.ϵ₁₂ + f′′*h.ϵ₁*h.ϵ₂)
Base.sin(h) = chain(h, sin(h.v), cos(h.v), -sin(h.v))

second_derivative(f, x) =
    f(HyperDual(x, one(x), one(x), zero(x))).ϵ₁₂
```
:::

---
@eyebrow The package
# What's in the box

```using HyperHessians | the API
julia> H = hessian(f, x)                 # dense n×n Hessian

julia> cfg = HessianConfig(x)            # preallocate buffers, pick chunk size
julia> hessian!(H, f, x, cfg)            # in place — zero allocations

julia> hessian_gradient_value(f, x)      # value, gradient and Hessian in one go

julia> hvp(f, x, v)                      # Hessian·vector, without forming H

julia> cfg = ThreadedHessianConfig(x)    # same, but blocks run on threads
julia> hessian!(H, f, x, cfg)
```

- Drop-in for the usual ForwardDiff Hessian workflow — same kind of config objects, same in-place API.
- HVPs take one tangent or a bundle of them in a single sweep.

---
@eyebrow The package
# Scaling up: wide lanes, one block per call

::: cols
:: col 1.15
```HyperDual{N₁, N₂, T} | the scalar fields become tuples
v    :: T
ϵ1   :: NTuple{8, T}        # 8 input directions
ϵ2   :: NTuple{8, T}        # 8 more directions
ϵ12  :: 8 × NTuple{8, T}    # an 8×8 Hessian block

# one call to f fills a whole 8×8 block
```

- The Hessian is symmetric, so only blocks with j ≥ i get evaluated; the rest is mirrored.
- The blocks are independent — that's also what the threaded config parallelizes.
:: col
**Block (i, j) needs one evaluation — and only the shaded half is computed** (n = 256, chunk 8)

{{grid-hh}}

> k(k+1)/2 = 528 evaluations instead of k² = 1024.
:::

@eyebrow Performance
# Compared with ForwardDiff

Both packages get identical settings: chunk size 8, so both dual types hold exactly the same 81 Float64s — 648 bytes, same algebra, same flop count. Any speed difference is implementation, not math.

| hessian! · n = 256 | machine | ForwardDiff | HyperHessians | speedup |
|---|---|---|---|---|
| ackley | Apple M4 | 20.4 ms | *9.1 ms* | 2.23× |
| rosenbrock_1 | Apple M4 | 23.9 ms | *6.5 ms* | 3.67× |
| ackley | AMD Zen 4 | 25.7 ms | *5.9 ms* | 4.39× |
| rosenbrock_1 | AMD Zen 4 | 34.0 ms | *9.4 ms* | 3.64× |

> Half of this is the symmetry trick from the last slide. The rest comes from how the numbers are laid out in memory — next few slides.

| one f eval | ForwardDiff | HyperHessians | ratio |
|---|---|---|---|
| ackley · M4 | 16.4 µs | *16.0 µs* | 1.02× |

---
@eyebrow Performance
# 8 doubles fill registers. 9 don't.

::: panel HyperDual{8,8} — every lane is 8 doubles: exactly one AVX-512 register
{{lane-hh}}
:::

::: panel nested Dual 8×8 — same 648 bytes, but nine 9-double lanes, each with a leftover
{{lane-fd}}
:::

> Each cell is a `Float64`; each group is a lane the compiler handles as a unit. 8 doubles = 4 NEON / 2 AVX2 / 1 AVX-512 register. 9 doubles = full registers plus one straggler, on every lane, in every op. HyperHessians also writes every accumulation as `muladd`, so it compiles to fused multiply-adds; the nested layout's separate mul and add never fuse.

---
@eyebrow Performance
# What the CPU runs for one multiply (Zen 4)

::: cols
:: col
```HyperDual{8,8} * | 186 instructions
[+]   21× vfmadd231pd zmm  ; 8-wide fused
[+]    4× vfmadd213pd zmm
[+]   11× vmulpd zmm
  15× vbroadcastsd
  22× vmov (loads/stores)
  12× shuffle/gather
```
@pills good:25 zmm FMAs | good:each lane = one register
:: col
```nested Dual 8×8 * | 418 instructions
[-]   49× vpermt2pd        ; shuffles
[-]   18× vgatherdpd       ; gathers
  34× vmulpd + 25× vaddpd
[-]    0× vfmadd           ; never fused
  17× vmulsd + 8× vaddsd   ; leftovers
  83× vmov (loads/stores)
```
@pills bad:0 FMAs | bad:71 shuffle/gather | bad:25 scalar ops
:: col 0.9
- Half the nested-dual instructions just move data around.
- Multiply ends up 3.1× slower (53.5 vs 17.4 ns) on the same 648 bytes.
- 2.25× the instructions ≈ the 1.7–1.8× whole-function gap on this chip.
:::

@eyebrow Performance
# Flat structs let LLVM throw away dead lanes

::: cols
:: col 1.2
```DiffTests.rosenbrock_1 | the constants are duals
function rosenbrock_1(x)
[-]     a = one(eltype(x))     # a dual! ϵ ≡ 0
[-]     b = 100 * a            # a dual! ϵ ≡ 0
    result = zero(eltype(x))
    for i in 1:length(x)-1
        result += (a - x[i])^2 +
[-]               b * (x[i+1] - x[i]^2)^2
    end
    result
end
```
:: col
- Every loop iteration multiplies by a dual whose 80 derivative floats are known zeros.
- In the flat, fully-inlined `HyperDual` code, LLVM folds those zero lanes away — the multiply costs about as much as real × dual.
- In the nested layout the folding mostly fails, and the zeros get computed.
- Check: write the constants as plain `1` and `100` and the two types run at the same speed; with dual constants the gap is 1.74×.
:::

---
@eyebrow Performance
# Bookkeeping: allocations, seeding, extraction

| per hessian! call | ForwardDiff | HyperHessians |
|---|---|---|
| heap allocated | ~600 KB | *0 B* |
| gradient vectors allocated | 32 × 18.4 KB, one per outer chunk | *—* |
| full dual-array reseeding | 32 × 162 KB | *1 × 162 KB* |
| seed writes per evaluation | full inner chunk machinery | *16 array entries* |
| result extraction | dual gradient → copy into H columns | *ϵ₁₂ block → H directly* |
| time outside f evals (M4 ackley) | 3.6 ms — 18% | *0.6 ms — 7%* |

> Jacobian-of-gradient allocates a fresh gradient vector per outer chunk and re-seeds the whole input array each time. The hyper-dual driver fills one buffer per Hessian, touches 16 entries per pass, and writes each 8×8 block straight into H.

# Hessian-vector products and threads

::: cols
:: col
::: panel HVPs: make the lanes asymmetric
```
HyperDual{8, 1, Float64}
  ϵ1 ← identity chunks   (8 lanes)
  ϵ2 ← the tangent v      (1 lane)
  ϵ12 = H·v columns, directly
```
> No nesting, no second pass — the cross term is the answer. Several tangents at once: `HyperDual{8, k}`.
:::

::: panel Threads: the blocks are independent
| tasks | 1 | 2 | 4 | 8 |
|---|---|---|---|---|
| speedup (n=512) | 1.0× | 1.9× | 3.8× | *7.1×* |

> The k(k+1)/2 block evaluations only share reads, so `ThreadedHessianConfig` scales close to linearly over performance cores.
:::

---
@eyebrow Summary
# Summary

- Dual numbers turn derivatives into algebra. Hyper-duals do the same for second order — in one flat number instead of two nested ones.
- One evaluation per 8×8 Hessian block, upper triangle only, blocks in parallel if you want.
- The layout matches SIMD widths, everything inlines, and the driver allocates nothing.
- Result: 2–4× faster dense Hessians than ForwardDiff, plus HVPs in a single pass.

  .sw.hh { background: var(--s-hh); } .sw.fd { background: var(--s-fd); }
  .bargroup { margin-bottom: 0.55em; }
  .bargroup .g-label { font-family: ui-monospace, monospace; font-size: 0.7em; font-weight: 600; margin-bottom: 0.2em; }
  .bar-row { display: flex; align-items: center; gap: 0.6em; margin-bottom: 0.16em; }
  .bar-track { flex: 1 1 auto; position: relative; height: 0.7em; }
  .bar { position: absolute; left: 0; top: 8%; height: 84%; border-radius: 0 4px 4px 0; min-width: 3px; }
  .bar.hh { background: var(--s-hh); } .bar.fd { background: var(--s-fd); }
  .bar-val { flex: 0 0 5em; text-align: right; font-family: ui-monospace, monospace; font-size: 0.66em; color: var(--muted); }

  .lane-strip { display: flex; flex-wrap: wrap; gap: 3px; row-gap: 5px; }
  .cellgroup { display: flex; gap: 1px; }
  .cell { width: 0.52em; height: 0.9em; border-radius: 2px; }
  .cell.v { background: var(--faint); }
  .cell.e1 { background: var(--s-hh); opacity: 0.55; }
  .cell.e2 { background: var(--s-hh); opacity: 0.8; }
  .cell.e12 { background: var(--s-hh); }
  .cell.iv { background: var(--faint); }
  .cell.ip { background: var(--s-fd); }
  .cell.strag { background: var(--s-fd); opacity: 0.45; }

  .codecard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .cc-head { display: flex; justify-content: space-between; gap: 0.8em; align-items: baseline; padding: 0.55em 1em 0.5em; border-bottom: 1px solid var(--line); }
  .cc-title { font-family: -apple-system, system-ui, sans-serif; font-size: 0.72em; font-weight: 700; }
  .cc-sub { font-family: ui-monospace, monospace; font-size: 0.58em; color: var(--faint); }
  .codecard pre { margin: 0; padding: 0.55em 0 0.65em; background: var(--code-bg); color: var(--code-ink); font-size: 0.72em; line-height: 1.5; overflow-x: auto; flex: 1 1 auto; }
  /* full-width cards (not inside columns) have room for bigger code */
  .grow > .codecard pre { font-size: 0.85em; }
  .codecard pre .ln { display: block; padding: 0 1.1em; white-space: pre; }
  .codecard pre .cm { color: var(--code-cm); }
  .codecard pre .bad { background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad-edge); }
  .codecard pre .good { background: var(--good-bg); box-shadow: inset 3px 0 0 var(--good-edge); }
  .cc-verdict { display: flex; gap: 0.5em; flex-wrap: wrap; padding: 0.5em 1em; border-top: 1px solid var(--line); }
  .v-pill { font-family: ui-monospace, monospace; font-size: 0.58em; border-radius: 999px; padding: 0.2em 0.9em; background: var(--chip-bg); color: var(--muted); }
  .v-pill.bad { background: var(--bad-bg); color: var(--bad-edge); }
  .v-pill.good { background: var(--good-bg); color: var(--good-edge); }

  .footer-note {
    position: absolute; bottom: 1.8vh; left: 4.5vw; right: 4.5vw;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 0.6em; color: var(--faint);
  }

  ul { margin: 0; padding-left: 1.1em; }
  ul li { margin-bottom: 0.45em; max-width: 40em; }

  @media (prefers-reduced-motion: no-preference) {
    .slide.active { animation: fadein 0.18s ease-out; }
    @keyframes fadein { from { opacity: 0.3; } to { opacity: 1; } }
  }
  @media print {
    .slide { display: flex !important; min-height: auto; height: 100vh; page-break-after: always; }
    .footer-note .counter { display: none; }
  }
</style>

<div id="deck"></div>

<script>
(function () {
  "use strict";

  // ---------- helpers ----------
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, (_, t) => "<code>" + t + "</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return s;
  }
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  };

  // ---------- block parser ----------
  function parseBlocks(lines, parent, inPanel) {
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();

      if (t === "") { i++; continue; }

      if (t.startsWith("::: cols")) {
        const end = findFenceEnd(lines, i);
        parent.appendChild(buildCols(lines.slice(i + 1, end)));
        i = end + 1; continue;
      }
      if (t.startsWith("::: panel")) {
        const title = t.slice(9).trim();
        const end = findFenceEnd(lines, i);
        const panel = el("div", "panel");
        if (title) panel.appendChild(el("div", "panel-title sans", inline(title)));
        parseBlocks(lines.slice(i + 1, end), panel, true);
        parent.appendChild(panel);
        i = end + 1; continue;
      }
      if (t.startsWith("::: tiles")) {
        const end = findFenceEnd(lines, i);
        parent.appendChild(buildTiles(lines.slice(i + 1, end)));
        i = end + 1; continue;
      }

      if (t.startsWith("```")) {
        const header = t.slice(3).trim();
        let j = i + 1;
        const codeLines = [];
        while (j < lines.length && lines[j].trim() !== "```") { codeLines.push(lines[j]); j++; }
        let pills = null;
        if (j + 1 < lines.length && lines[j + 1].trim().startsWith("@pills")) {
          pills = lines[j + 1].trim().slice(6).trim();
        }
        parent.appendChild(buildCodeCard(header, codeLines, pills));
        i = j + 1 + (pills !== null ? 1 : 0); continue;
      }

      if (t.startsWith("|")) {
        let j = i;
        const rows = [];
        while (j < lines.length && lines[j].trim().startsWith("|")) { rows.push(lines[j].trim()); j++; }
        const table = buildTable(rows);
        if (inPanel) parent.appendChild(table);
        else { const p = el("div", "panel"); p.appendChild(table); parent.appendChild(p); }
        i = j; continue;
      }

      if (t.startsWith("- ")) {
        let j = i;
        const ul = el("ul");
        while (j < lines.length && lines[j].trim().startsWith("- ")) {
          ul.appendChild(el("li", null, inline(lines[j].trim().slice(2))));
          j++;
        }
        parent.appendChild(ul); i = j; continue;
      }

      if (t.startsWith("> ")) {
        parent.appendChild(el("p", "caption", inline(t.slice(2))));
        i++; continue;
      }

      const ph = t.match(/^\{\{([\w-]+)\}\}$/);
      if (ph) {
        parent.appendChild(buildFigure(ph[1]));
        i++; continue;
      }

      parent.appendChild(el("p", null, inline(t)));
      i++;
    }
  }

  function findFenceEnd(lines, start) {
    let depth = 0;
    for (let i = start; i < lines.length; i++) {
      const t = lines[i].trim();
      if (t.startsWith(":::") && t.length > 3) depth++;
      else if (t === ":::") { depth--; if (depth === 0) return i; }
    }
    return lines.length;
  }

  function buildCols(lines) {
    const cols = el("div", "cols");
    let cur = null;
    let buf = [];
    const flush = () => { if (cur) parseBlocks(buf, cur, false); buf = []; };
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      const m = t.match(/^:: col\s*([\d.]+)?$/);
      if (m) {
        flush();
        cur = el("div", "col");
        if (m[1]) cur.style.flex = m[1] + " 1 300px";
        cols.appendChild(cur);
      } else if (cur) {
        buf.push(lines[i]);
      }
    }
    flush();
    return cols;
  }

  function buildTiles(lines) {
    const eq = el("div", "equation sans");
    for (const raw of lines) {
      const t = raw.trim();
      if (t === "") continue;
      if (t === "×" || t === "x") { eq.appendChild(el("div", "op", "×")); continue; }
      if (t === "≈" || t === "=") { eq.appendChild(el("div", "op", "≈")); continue; }
      const result = t.startsWith("!");
      const parts = (result ? t.slice(1) : t).split("|").map(s => s.trim());
      const tile = el("div", "tile" + (result ? " result" : ""));
      tile.appendChild(el("div", "t-label", inline(parts[0] || "")));
      tile.appendChild(el("div", "t-value", inline(parts[1] || "")));
      if (parts[2]) tile.appendChild(el("div", "t-note", inline(parts[2])));
      eq.appendChild(tile);
    }
    return eq;
  }

  function buildTable(rows) {
    const table = el("table");
    let head = true;
    for (const r of rows) {
      if (/^\|[\s|:-]+\|$/.test(r)) { head = false; continue; }
      const cells = r.slice(1, r.endsWith("|") ? -1 : undefined).split("|").map(s => s.trim());
      const tr = el("tr");
      for (const c of cells) tr.appendChild(el(head ? "th" : "td", null, inline(c)));
      (head ? tableHead(table) : tableBody(table)).appendChild(tr);
    }
    return table;
  }
  function tableHead(t) { let h = t.querySelector("thead"); if (!h) { h = el("thead"); t.appendChild(h); } return h; }
  function tableBody(t) { let b = t.querySelector("tbody"); if (!b) { b = el("tbody"); t.appendChild(b); } return b; }

  function buildCodeCard(header, codeLines, pills) {
    const card = el("div", "codecard");
    if (header) {
      const [title, sub] = header.split("|").map(s => s.trim());
      const head = el("div", "cc-head");
      head.appendChild(el("span", "cc-title", inline(title)));
      if (sub) head.appendChild(el("span", "cc-sub", inline(sub)));
      card.appendChild(head);
    }
    const pre = el("pre");
    const code = el("code");
    for (let raw of codeLines) {
      let cls = "ln";
      if (raw.startsWith("[+]")) { cls += " good"; raw = raw.slice(3); }
      else if (raw.startsWith("[-]")) { cls += " bad"; raw = raw.slice(3); }
      let html = esc(raw);
      html = html.replace(/(^\s*[#;].*$)|(\s[#;] .*$)/, m => '<span class="cm">' + m + "</span>");
      code.appendChild(el("span", cls, html || " "));
    }
    pre.appendChild(code);
    card.appendChild(pre);
    if (pills) {
      const v = el("div", "cc-verdict");
      for (const p of pills.split("|").map(s => s.trim())) {
        const m = p.match(/^(good|bad):(.*)$/);
        v.appendChild(el("span", "v-pill" + (m ? " " + m[1] : ""), inline(m ? m[2].trim() : p)));
      }
      card.appendChild(v);
    }
    return card;
  }

  // ---------- generated figures ----------
  function buildFigure(name) {
    if (name === "grid-fd" || name === "grid-hh") {
      const g = el("div", "blocks-grid");
      const hh = name === "grid-hh";
      for (let i = 0; i < 32; i++)
        for (let j = 0; j < 32; j++) {
          const d = el("div");
          if (!hh) d.className = "on-fd";
          else if (j >= i) d.className = "on-hh";
          g.appendChild(d);
        }
      return g;
    }
    if (name === "lane-hh" || name === "lane-fd") {
      const strip = el("div", "lane-strip");
      const group = cells => {
        const g = el("div", "cellgroup");
        for (const c of cells) g.appendChild(el("div", "cell " + c));
        strip.appendChild(g);
      };
      if (name === "lane-hh") {
        group(["v"]);
        group(Array(8).fill("e1"));
        group(Array(8).fill("e2"));
        for (let r = 0; r < 8; r++) group(Array(8).fill("e12"));
      } else {
        for (let r = 0; r < 9; r++) group(["iv"].concat(Array(7).fill("ip"), ["strag"]));
      }
      return strip;
    }
    if (name === "opchart") {
      // per-op ns/element, Apple M4, [HyperDual, nested Dual]
      const data = [
        { op: "*", vals: [17.7, 22.7] },
        { op: "/", vals: [22.7, 25.8] },
        { op: "exp", vals: [26.5, 24.3] },
        { op: "sqrt", vals: [13.8, 14.7] },
        { op: "sin", vals: [29.5, 31.7] },
      ];
      const max = Math.max(...data.flatMap(d => d.vals));
      const wrap = el("div");
      const legend = el("div", "legend sans");
      legend.innerHTML = '<span><i class="sw hh"></i>HyperDual{8,8}</span><span><i class="sw fd"></i>nested Dual 8×8</span>';
      wrap.appendChild(legend);
      for (const g of data) {
        const grp = el("div", "bargroup");
        grp.appendChild(el("div", "g-label", esc(g.op)));
        g.vals.forEach((v, k) => {
          const row = el("div", "bar-row");
          const track = el("div", "bar-track");
          const bar = el("div", "bar " + (k === 0 ? "hh" : "fd"));
          bar.style.width = (v / max * 100).toFixed(1) + "%";
          track.appendChild(bar);
          row.appendChild(track);
          row.appendChild(el("div", "bar-val", v.toFixed(1) + " ns"));
          grp.appendChild(row);
        });
        wrap.appendChild(grp);
      }
      return wrap;
    }
    return el("div", null, "[unknown figure: " + esc(name) + "]");
  }

  // ---------- slide assembly ----------
  const src = document.getElementById("deck-src").textContent;
  const slideSources = src.split(/\n---\n/).map(s => s.split("\n"));
  const deck = document.getElementById("deck");

  for (const lines of slideSources) {
    const slide = el("section", "slide");
    let layoutTitle = false, eyebrow = null, heading = null, lede = [], chips = null, footer = "";
    const bodyLines = [];
    let inCode = false;
    for (const raw of lines) {
      const t = raw.trim();
      if (t.startsWith("```")) { inCode = !inCode; bodyLines.push(raw); continue; }
      if (inCode) { bodyLines.push(raw); continue; }
      if (t.startsWith("@layout")) { layoutTitle = /title/.test(t); }
      else if (t.startsWith("@eyebrow")) eyebrow = t.slice(8).trim();
      else if (t.startsWith("@chips")) chips = t.slice(6).trim();
      else if (t.startsWith("@footer")) footer = t.slice(7).trim();
      else if (t.startsWith("# ")) heading = t.slice(2);
      else if (t.startsWith("~ ")) lede.push(t.slice(2));
      else bodyLines.push(raw);
    }
    const head = el("div");
    if (eyebrow) head.appendChild(el("p", "eyebrow", inline(eyebrow)));
    if (heading) head.appendChild(el(layoutTitle ? "h1" : "h2", null, inline(heading)));
    for (const l of lede) head.appendChild(el("p", "lede", inline(l)));

    const grow = el("div", "grow");
    if (layoutTitle) {
      grow.appendChild(head);
      parseBlocks(bodyLines, grow, false);
      if (chips) {
        const row = el("div", "chips sans");
        for (const c of chips.split("|").map(s => s.trim())) row.appendChild(el("span", "chip", inline(c)));
        grow.appendChild(row);
      }
      slide.appendChild(grow);
    } else {
      slide.appendChild(head);
      parseBlocks(bodyLines, grow, false);
      slide.appendChild(grow);
    }
    const foot = el("div", "footer-note");
    foot.appendChild(el("span", null, inline(footer)));
    foot.appendChild(el("span", "counter"));
    slide.appendChild(foot);
    deck.appendChild(slide);
  }

  // ---------- navigation ----------
  const slides = Array.from(document.querySelectorAll(".slide"));
  let cur = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), slides.length - 1);
  function show(i) {
    cur = Math.min(Math.max(i, 0), slides.length - 1);
    slides.forEach((s, k) => s.classList.toggle("active", k === cur));
    history.replaceState(null, "", "#" + (cur + 1));
    document.querySelectorAll(".counter").forEach(c => c.textContent = (cur + 1) + " / " + slides.length);
  }
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { show(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { show(cur - 1); e.preventDefault(); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "p") window.print();
  });
  addEventListener("click", e => {
    if (e.target.closest("a, code, pre, table")) return;
    show(e.clientX > innerWidth / 3 ? cur + 1 : cur - 1);
  });
  show(cur);
})();
</script>

@eyebrow HyperHessians.jl · performance forensics
# Anatomy of a speedup
~ Why computing a dense Hessian with **hyper-dual numbers** is 2.2–4.4× faster than **nested forward-mode duals** — measured, decomposed, and verified down to the instruction level.
@chips Apple M4 (NEON) · AMD Zen 4 (AVX-512) | Julia 1.12.6 | vs ForwardDiff, inlining fix applied | n = 256 · chunk 8 both
@footer HyperHessians.jl · → / ← / click to navigate · p to print

---
@eyebrow The result
# One number is a benchmark. A product of factors is an explanation.
@footer chunk size pinned to 8 for both · BenchmarkTools minimum times · single thread

::: tiles
1 · Symmetry | 1.94× | evaluate only upper-triangular block pairs
×
2 · Arithmetic / eval | 1.0–1.8× | FMA-fused, register-exact SIMD lanes
×
3 · Overhead | 1.1–1.3× | zero allocation, minimal seeding & extraction
≈
! Measured | 2.2–4.4× | every total reproduced by its factors
:::

| hessian! · n = 256 | machine | ForwardDiff | HyperHessians | speedup |
|---|---|---|---|---|
| ackley | Apple M4 | 20.4 ms | *9.1 ms* | 2.23× |
| rosenbrock_1 | Apple M4 | 23.9 ms | *6.5 ms* | 3.67× |
| ackley | AMD Zen 4 | 25.7 ms | *5.9 ms* | 4.39× |
| rosenbrock_1 | AMD Zen 4 | 34.0 ms | *9.4 ms* | 3.64× |

---
@eyebrow Setup
# Two ways to carry second derivatives
@footer HyperDual multiplication: ϵ₁₂[i] ← v₁A₂[i] + A₁[i]v₂ + a₁[i]b₂ + a₂[i]b₁

::: cols
:: col
```ForwardDiff — nested duals | Hessian = J(∇f)
Dual{T, Dual{T, Float64, 8}, 8}

# 9 inner duals of 9 floats each:
value    :: Dual{T,Float64,8}   # 1+8
partials :: 8 × Dual{T,Float64,8}

# (1+8)² = 81 floats, 648 bytes
# second derivatives live in the
# partials-of-partials cross terms
```
@pills outer chunked Jacobian ∘ inner chunked gradient
:: col
```HyperHessians — hyper-duals | h = v + ϵ₁ᵀa + ϵ₂ᵀb + ϵ₁ᵀAϵ₂
HyperDual{8, 8, Float64}

[+] v   :: Float64             # value
[+] ϵ1  :: NTuple{8, Float64}  # ∇ lanes
[+] ϵ2  :: NTuple{8, Float64}  # ∇ lanes
[+] ϵ12 :: 8 × NTuple{8, Float64}  # H block

# 1+8+8+64 = 81 floats, 648 bytes
# the 8×8 Hessian block is explicit
```
@pills good:one evaluation per 8×8 block pair
:::

> Identical payload — 81 floats, 648 bytes — and expanding the nested product gives term-for-term the hyper-dual cross-term formula. Same algebra, same flop count. Everything that follows is structure, not math.

---
@eyebrow Factor 1 · 1.94×
# A Hessian is symmetric. Compute half of it.
@footer same 256×256 Hessian, same 8×8 blocks, in both grids

::: cols
:: col
**ForwardDiff — every 8×8 block of the full square**

{{grid-fd}}

> **32² = 1024** evaluations of f
:: col
**HyperHessians — upper-triangular block pairs, then mirror**

{{grid-hh}}

> **32·33/2 = 528** evaluations of f → **1.94×** fewer
:: col 1.1
- Jacobian-of-gradient has no place to exploit symmetry: each outer chunk needs the *full* gradient.
- Independent ϵ₁ / ϵ₂ seeds address blocks (i, j) directly — evaluate only j ≥ i.
- Eval counts verified with a counting closure; block pairs are embarrassingly parallel (7.1× on 8 cores).
:::

---
@eyebrow Factor 2 · 1.0–1.8×
# Same 81 floats per number — so why is one faster?
@footer three mechanisms follow →

::: cols
:: col 1.3
::: panel
{{opchart}}
> ns per element, streamed over 256-element vectors, Apple M4. Isolated ops are close on NEON — the interesting differences appear in registers and on wider SIMD.
:::
:: col
| one f eval | ForwardDiff | HyperHessians | ratio |
|---|---|---|---|
| ackley · M4 | 16.4 µs | *16.0 µs* | 1.02× |
| rosenbrock · M4 | 19.5 µs | *11.2 µs* | 1.74× |
| ackley · Zen 4 | 18.9 µs | *10.7 µs* | 1.77× |
| rosenbrock · Zen 4 | 28.6 µs | *17.0 µs* | 1.68× |

> Whole functions tell a sharper story than single ops: transcendental-bound code converges, register-resident arithmetic doesn't.
:::

---
@eyebrow Factor 2 · mechanism A
# Lane shape: 8 is a SIMD width. 9 is not.
@footer on 2-wide NEON the straggler is cheap — on 8-wide AVX-512 it is not →

::: panel HyperDual{8,8} — every derivative lane is 8 doubles = whole registers (one zmm)
{{lane-hh}}
:::

::: panel nested Dual 8×8 — same 648 bytes sliced into nine 9-double lanes, a straggler in every one
{{lane-fd}}
:::

> Each cell is one `Float64`; each group is a lane the compiler processes as a unit. 8 doubles = 4×NEON, 2×AVX2, or exactly **1×AVX-512 register**. 9 doubles = a full vector set *plus a scalar straggler* — on every lane, in every operation. HyperHessians also fuses every accumulation through `muladd`; the nested layout's mul-then-add never fuses.

---
@eyebrow Factor 2 · mechanism A, measured on Zen 4
# On AVX-512, one multiply: 25 FMAs vs 71 shuffles
@footer code_native, AMD EPYC 9354 · full listings in benchmark/why-faster/results/

::: cols
:: col
```HyperDual{8,8} * | 186 instructions
[+]   21× vfmadd231pd zmm  ; 8-wide fused
[+]    4× vfmadd213pd zmm
[+]   11× vmulpd zmm
  15× vbroadcastsd
  22× vmov (loads/stores)
  12× shuffle/gather
```
@pills good:25 zmm FMAs | good:each lane = one register
:: col
```nested Dual 8×8 * | 418 instructions
[-]   49× vpermt2pd        ; shuffles
[-]   18× vgatherdpd       ; gathers
  34× vmulpd + 25× vaddpd
[-]    0× vfmadd           ; never fused
  17× vmulsd + 8× vaddsd   ; stragglers
  83× vmov (loads/stores)
```
@pills bad:0 FMAs | bad:71 shuffle/gather | bad:25 scalar ops
:: col 0.9
- More instructions *rearranging data* than doing arithmetic.
- Result: multiply is **3.1× slower** (53.5 vs 17.4 ns/element) at identical payload.
- 2.25× the instruction count → the whole-function 1.7–1.8× gap on Zen 4.
:::

---
@eyebrow Factor 2 · mechanism B
# Flat layouts let LLVM delete dead derivative lanes
@footer same zeros, same algebra — transparency to the compiler differs

::: cols
:: col 1.2
```DiffTests.rosenbrock_1 | the constants are duals
function rosenbrock_1(x)
[-]     a = one(eltype(x))     # a dual! ϵ ≡ 0
[-]     b = 100 * a            # a dual! ϵ ≡ 0
    result = zero(eltype(x))
    for i in 1:length(x)-1
        result += (a - x[i])^2 +
[-]               b * (x[i+1] - x[i]^2)^2
    end
    result
end
```
:: col
- Every iteration multiplies by a dual whose 80 derivative floats are **known zeros**.
- Through the flat, fully-inlined `HyperDual` code, LLVM constant-folds the dead lanes away — the op collapses to near real×dual cost.
- Through the nested representation the folding largely fails: the zeros are computed.
- Evidence: rewrite with literal `1` and `100` and the two types run at **parity** (33.6 vs 35.0 ns/element); with dual constants the gap is 1.74×.
:::

---
@eyebrow Factor 3 · 1.1–1.3×
# Everything around the evaluations
@footer measured with @allocated after warmup

| per hessian! call · n = 256 | ForwardDiff | HyperHessians |
|---|---|---|
| heap allocated | ~600 KB | *0 B* |
| gradient vectors allocated | 32 × 18.4 KB, one per outer chunk | *—* |
| full dual-array reseeding | 32 × 162 KB | *1 × 162 KB* |
| seed writes per evaluation | full inner chunk machinery | *16 array entries* |
| result extraction | dual gradient → copy into H columns | *ϵ₁₂ block → H directly* |
| time outside f evals (M4 ackley) | 3.6 ms — 18% | *0.6 ms — 7%* |

> The Jacobian-of-gradient driver allocates a fresh dual-typed gradient vector on every outer chunk and re-seeds the whole input array; the hyper-dual driver fills one buffer per Hessian, seeds 16 entries per pass, reuses the ϵ₁ seed across the inner loop, and writes each 8×8 block straight into H.

---
@eyebrow Verification
# The accounting closes
@footer evals × per-eval cost + residual = total, on both machines

| case | symmetry | arithmetic | overhead | product | measured |
|---|---|---|---|---|---|
| ackley · M4 | 1.94× | 1.02× | 1.12× | 2.2× | *2.23×* |
| rosenbrock · M4 | 1.94× | 1.74× | 1.09× | 3.7× | *3.67×* |
| ackley · Zen 4 | 1.94× | 1.77× | 1.29× | 4.4× | *4.39×* |
| rosenbrock · Zen 4 | 1.94× | 1.68× | 1.10× | 3.6× | *3.64×* |

> Each factor measured independently: eval counts by counting closure, arithmetic by timing single evaluations of f on each dual type, overhead as the residual — and their product matches every end-to-end total. No unexplained speedup, no benchmark magic.

---
@eyebrow Beyond one Hessian
# The same structure keeps paying
@footer hvp / hvp! / vhvp and ThreadedHessianConfig in the package API

::: cols
:: col
::: panel Hessian-vector products: asymmetric lanes
```
HyperDual{8, 1, Float64}
  ϵ1 ← identity chunks   (8 lanes)
  ϵ2 ← the tangent v      (1 lane)
  ϵ12 = H·v columns, directly
```
> No nesting, no second pass — the mixed term *is* the answer. Bundle multiple tangents as `HyperDual{8, k}`.
:::
:: col
::: panel Threading: block pairs are independent
| tasks | 1 | 2 | 4 | 8 |
|---|---|---|---|---|
| speedup (n=512) | 1.0× | 1.9× | 3.8× | *7.1×* |

> The k(k+1)/2 evaluations share nothing but reads — `ThreadedHessianConfig` scales near-linearly across performance cores.
:::
:::

---
@eyebrow Takeaways
# Speed came from structure the compiler can see
@footer github.com/KristofferC/HyperHessians.jl · analysis & scripts: benchmark/why-faster/

- **Exploit the math:** symmetry alone halves the work — 1.94× before any code tricks.
- **Shape data for the machine:** 8-wide flat lanes are register-exact and FMA-fusable; nested 9-wide lanes cost shuffles, gathers, and stragglers on every op.
- **Stay transparent to LLVM:** flat + fully inlined means dead derivative lanes fold away and intermediates never touch memory.
- **Keep the driver silent:** zero allocations, 16 seed writes per pass, blocks written straight into H.
- **Decompose your benchmarks:** a speedup you can't factor is a speedup you don't understand.

    s = s.replace(/`([^`]+)`/g, (_, t) => "<code>" + t + "</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return s;
  }
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  };

  // ---------- block parser ----------
  // Parses an array of lines into DOM nodes appended to `parent`.
  function parseBlocks(lines, parent, inPanel) {
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();

      if (t === "") { i++; continue; }

      // fenced sub-structures --------------------------------------------
      if (t.startsWith("::: cols")) {
        const end = findFenceEnd(lines, i);
        const inner = lines.slice(i + 1, end);
        parent.appendChild(buildCols(inner));
        i = end + 1; continue;
      }
      if (t.startsWith("::: panel")) {
        const title = t.slice(9).trim();
        const end = findFenceEnd(lines, i);
        const panel = el("div", "panel");
        if (title) panel.appendChild(el("div", "panel-title sans", inline(title)));
        parseBlocks(lines.slice(i + 1, end), panel, true);
        parent.appendChild(panel);
        i = end + 1; continue;
      }
      if (t.startsWith("::: tiles")) {
        const end = findFenceEnd(lines, i);
        parent.appendChild(buildTiles(lines.slice(i + 1, end)));
        i = end + 1; continue;
      }

      // code card ---------------------------------------------------------
      if (t.startsWith("```")) {
        const header = t.slice(3).trim();
        let j = i + 1;
        const codeLines = [];
        while (j < lines.length && lines[j].trim() !== "```") { codeLines.push(lines[j]); j++; }
        let pills = null;
        if (j + 1 < lines.length && lines[j + 1].trim().startsWith("@pills")) {
          pills = lines[j + 1].trim().slice(6).trim();
        }
        parent.appendChild(buildCodeCard(header, codeLines, pills));
        i = j + 1 + (pills !== null ? 1 : 0); continue;
      }

      // table --------------------------------------------------------------
      if (t.startsWith("|")) {
        let j = i;
        const rows = [];
        while (j < lines.length && lines[j].trim().startsWith("|")) { rows.push(lines[j].trim()); j++; }
        const table = buildTable(rows);
        if (inPanel) parent.appendChild(table);
        else { const p = el("div", "panel"); p.appendChild(table); parent.appendChild(p); }
        i = j; continue;
      }

      // bullets -------------------------------------------------------------
      if (t.startsWith("- ")) {
        let j = i;
        const ul = el("ul");
        while (j < lines.length && lines[j].trim().startsWith("- ")) {
          ul.appendChild(el("li", null, inline(lines[j].trim().slice(2))));
          j++;
        }
        parent.appendChild(ul); i = j; continue;
      }

      // caption --------------------------------------------------------------
      if (t.startsWith("> ")) {
        parent.appendChild(el("p", "caption", inline(t.slice(2))));
        i++; continue;
      }

      // figure placeholder ----------------------------------------------------
      const ph = t.match(/^\{\{([\w-]+)\}\}$/);
      if (ph) {
        parent.appendChild(buildFigure(ph[1]));
        i++; continue;
      }

      // plain paragraph ---------------------------------------------------------
      parent.appendChild(el("p", null, inline(t)));
      i++;
    }
  }

  function findFenceEnd(lines, start) {
    let depth = 0;
    for (let i = start; i < lines.length; i++) {
      const t = lines[i].trim();
      if (t.startsWith(":::") && t.length > 3) depth++;
      else if (t === ":::") { depth--; if (depth === 0) return i; }
    }
    return lines.length;
  }

  function buildCols(lines) {
    const cols = el("div", "cols");
    let cur = null;
    let buf = [];
    const flush = () => { if (cur) parseBlocks(buf, cur, false); buf = []; };
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      const m = t.match(/^:: col\s*([\d.]+)?$/);
      if (m) {
        flush();
        cur = el("div", "col");
        if (m[1]) cur.style.flex = m[1] + " 1 300px";
        cols.appendChild(cur);
      } else if (cur) {
        // keep nested fences intact for recursive parsing
        buf.push(lines[i]);
      }
    }
    flush();
    return cols;
  }

  function buildTiles(lines) {
    const eq = el("div", "equation sans");
    for (const raw of lines) {
      const t = raw.trim();
      if (t === "") continue;
      if (t === "×" || t === "x") { eq.appendChild(el("div", "op", "×")); continue; }
      if (t === "≈" || t === "=") { eq.appendChild(el("div", "op", "≈")); continue; }
      const result = t.startsWith("!");
      const parts = (result ? t.slice(1) : t).split("|").map(s => s.trim());
      const tile = el("div", "tile" + (result ? " result" : ""));
      tile.appendChild(el("div", "t-label", inline(parts[0] || "")));
      tile.appendChild(el("div", "t-value", inline(parts[1] || "")));
      if (parts[2]) tile.appendChild(el("div", "t-note", inline(parts[2])));
      eq.appendChild(tile);
    }
    return eq;
  }

  function buildTable(rows) {
    const table = el("table");
    let head = true;
    for (const r of rows) {
      if (/^\|[\s|:-]+\|$/.test(r)) { head = false; continue; }
      const cells = r.slice(1, r.endsWith("|") ? -1 : undefined).split("|").map(s => s.trim());
      const tr = el("tr");
      for (const c of cells) tr.appendChild(el(head ? "th" : "td", null, inline(c)));
      (head ? tableHead(table) : tableBody(table)).appendChild(tr);
    }
    return table;
  }
  function tableHead(t) { let h = t.querySelector("thead"); if (!h) { h = el("thead"); t.appendChild(h); } return h; }
  function tableBody(t) { let b = t.querySelector("tbody"); if (!b) { b = el("tbody"); t.appendChild(b); } return b; }

  function buildCodeCard(header, codeLines, pills) {
    const card = el("div", "codecard");
    if (header) {
      const [title, sub] = header.split("|").map(s => s.trim());
      const head = el("div", "cc-head");
      head.appendChild(el("span", "cc-title", inline(title)));
      if (sub) head.appendChild(el("span", "cc-sub", inline(sub)));
      card.appendChild(head);
    }
    const pre = el("pre");
    const code = el("code");
    for (let raw of codeLines) {
      let cls = "ln";
      if (raw.startsWith("[+]")) { cls += " good"; raw = raw.slice(3); }
      else if (raw.startsWith("[-]")) { cls += " bad"; raw = raw.slice(3); }
      let html = esc(raw);
      // gray out trailing # / ; comments (or whole-line comments)
      html = html.replace(/(^\s*[#;].*$)|(\s[#;] .*$)/, m => '<span class="cm">' + m + "</span>");
      code.appendChild(el("span", cls, html || " "));
    }
    pre.appendChild(code);
    card.appendChild(pre);
    if (pills) {
      const v = el("div", "cc-verdict");
      for (const p of pills.split("|").map(s => s.trim())) {
        const m = p.match(/^(good|bad):(.*)$/);
        v.appendChild(el("span", "v-pill" + (m ? " " + m[1] : ""), inline(m ? m[2].trim() : p)));
      }
      card.appendChild(v);
    }
    return card;
  }

  // ---------- generated figures ----------
  function buildFigure(name) {
    if (name === "grid-fd" || name === "grid-hh") {
      const g = el("div", "blocks-grid");
      const hh = name === "grid-hh";
      for (let i = 0; i < 32; i++)
        for (let j = 0; j < 32; j++) {
          const d = el("div");
          if (!hh) d.className = "on-fd";
          else if (j >= i) d.className = "on-hh";
          g.appendChild(d);
        }
      return g;
    }
    if (name === "lane-hh" || name === "lane-fd") {
      const strip = el("div", "lane-strip");
      const group = cells => {
        const g = el("div", "cellgroup");
        for (const c of cells) g.appendChild(el("div", "cell " + c));
        strip.appendChild(g);
      };
      if (name === "lane-hh") {
        group(["v"]);
        group(Array(8).fill("e1"));
        group(Array(8).fill("e2"));
        for (let r = 0; r < 8; r++) group(Array(8).fill("e12"));
      } else {
        for (let r = 0; r < 9; r++) group(["iv"].concat(Array(7).fill("ip"), ["strag"]));
      }
      return strip;
    }
    if (name === "opchart") {
      // per-op ns/element, Apple M4, [HyperDual, nested Dual]
      const data = [
        { op: "*", vals: [17.7, 22.7] },
        { op: "/", vals: [22.7, 25.8] },
        { op: "exp", vals: [26.5, 24.3] },
        { op: "sqrt", vals: [13.8, 14.7] },
        { op: "sin", vals: [29.5, 31.7] },
      ];
      const max = Math.max(...data.flatMap(d => d.vals));
      const wrap = el("div");
      const legend = el("div", "legend sans");
      legend.innerHTML = '<span><i class="sw hh"></i>HyperDual{8,8}</span><span><i class="sw fd"></i>nested Dual 8×8</span>';
      wrap.appendChild(legend);
      for (const g of data) {
        const grp = el("div", "bargroup");
        grp.appendChild(el("div", "g-label", esc(g.op)));
        g.vals.forEach((v, k) => {
          const row = el("div", "bar-row");
          const track = el("div", "bar-track");
          const bar = el("div", "bar " + (k === 0 ? "hh" : "fd"));
          bar.style.width = (v / max * 100).toFixed(1) + "%";
          track.appendChild(bar);
          row.appendChild(track);
          row.appendChild(el("div", "bar-val", v.toFixed(1) + " ns"));
          grp.appendChild(row);
        });
        wrap.appendChild(grp);
      }
      return wrap;
    }
    return el("div", null, "[unknown figure: " + esc(name) + "]");
  }

  // ---------- slide assembly ----------
  const src = document.getElementById("deck-src").textContent;
  const slideSources = src.split(/\n---\n/).map(s => s.split("\n"));
  const deck = document.getElementById("deck");

  for (const lines of slideSources) {
    const slide = el("section", "slide");
    let layoutTitle = false, eyebrow = null, heading = null, lede = [], chips = null, footer = "";
    const bodyLines = [];
    let inCode = false;
    for (const raw of lines) {
      const t = raw.trim();
      if (t.startsWith("```")) { inCode = !inCode; bodyLines.push(raw); continue; }
      if (inCode) { bodyLines.push(raw); continue; }
      if (t.startsWith("@layout")) { layoutTitle = /title/.test(t); }
      else if (t.startsWith("@eyebrow")) eyebrow = t.slice(8).trim();
      else if (t.startsWith("@chips")) chips = t.slice(6).trim();
      else if (t.startsWith("@footer")) footer = t.slice(7).trim();
      else if (t.startsWith("# ")) heading = t.slice(2);
      else if (t.startsWith("~ ")) lede.push(t.slice(2));
      else bodyLines.push(raw);
    }
    const head = el("div");
    if (eyebrow) head.appendChild(el("p", "eyebrow", inline(eyebrow)));
    if (heading) head.appendChild(el(layoutTitle ? "h1" : "h2", null, inline(heading)));
    for (const l of lede) head.appendChild(el("p", "lede", inline(l)));

    const grow = el("div", "grow");
    if (layoutTitle) {
      grow.appendChild(head);
      parseBlocks(bodyLines, grow, false);
      if (chips) {
        const row = el("div", "chips sans");
        for (const c of chips.split("|").map(s => s.trim())) row.appendChild(el("span", "chip", inline(c)));
        grow.appendChild(row);
      }
      slide.appendChild(grow);
    } else {
      slide.appendChild(head);
      parseBlocks(bodyLines, grow, false);
      slide.appendChild(grow);
    }
    const foot = el("div", "footer-note");
    foot.appendChild(el("span", null, inline(footer)));
    foot.appendChild(el("span", "counter"));
    slide.appendChild(foot);
    deck.appendChild(slide);
  }

  // ---------- navigation ----------
  const slides = Array.from(document.querySelectorAll(".slide"));
  let cur = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), slides.length - 1);
  function show(i) {
    cur = Math.min(Math.max(i, 0), slides.length - 1);
    slides.forEach((s, k) => s.classList.toggle("active", k === cur));
    history.replaceState(null, "", "#" + (cur + 1));
    document.querySelectorAll(".counter").forEach(c => c.textContent = (cur + 1) + " / " + slides.length);
  }
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { show(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { show(cur - 1); e.preventDefault(); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "p") window.print();
  });
  addEventListener("click", e => {
    if (e.target.closest("a, code, pre, table")) return;
    show(e.clientX > innerWidth / 3 ? cur + 1 : cur - 1);
  });
  show(cur);
})();
</script>
